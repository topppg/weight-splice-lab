[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "weight-splice-lab"
version = "0.1.0"
description = "Can an LLM agent add a capability to a pretrained model by writing weights directly, without gradients?"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.6",
    "transformers>=4.57",
    "safetensors>=0.5",
    "huggingface-hub>=0.30",
    "numpy>=2.0",
    "datasets>=3.0",
    "psutil>=7.2.2",
    "mlx-lm>=0.28",
    "math-verify>=0.7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/weight_splice_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
